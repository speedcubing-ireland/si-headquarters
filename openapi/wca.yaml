---
openapi: 3.1.0
info:
  title: WCA API
  summary: WCA API endpoints accessible via OAuth bearer tokens or without authentication
  description: These endpoints can be accessed by third-party applications using OAuth bearer tokens, or are publicly accessible without authentication.
  contact:
    name: WCA Software Team
    url: https://www.worldcubeassociation.org
    email: software@worldcubeassociation.org
  version: 0.2.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://www.worldcubeassociation.org/api
  description: Production server
- url: http://localhost:3000/api
  description: Development server
paths:
  "/v1/competitions/{competitionId}/registrations":
    get:
      summary: Get competition registrations
      tags:
      - competitions
      - registrations
      operationId: competitionRegistrationsV2
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/RegistrationDataV2"
      security: []
  "/v1/competitions/{competitionId}/live/rounds/{roundId}":
    get:
      summary: Gets Information about the Round including the live Results
      tags:
      - live
      operationId: liveByRound
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      - name: roundId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns results
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiveRound"
      security: []
  "/v1/competitions/{competitionId}/live/podiums":
    get:
      summary: Gets Information about the Podiums of the Live Results
      tags:
      - live
      operationId: livePodiums
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns podiums with round information
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/LiveRound"
      security: []
  "/v1/competitions/{competitionId}/live/registrations/{registrationId}":
    get:
      summary: Gets Information about the Competitors's live result
      tags:
      - live
      operationId: liveByPerson
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a person and their results
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LivePerson"
      security: []
  "/v0/healthcheck":
    get:
      summary: API health check
      tags:
      - system
      operationId: healthcheck
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  api_instance:
                    type: boolean
                    example: false
      security: []
  "/v0/scramble-program":
    get:
      summary: Get scramble program information
      tags:
      - system
      operationId: getScrambleProgram
      responses:
        '200':
          description: Scramble program information
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      name:
                        type: string
                        example: TNoodle-WCA-1.2.3
                      information:
                        type: string
                        format: uri
                        example: https://www.worldcubeassociation.org/regulations/scrambles/
                      download:
                        type: string
                        format: uri
                        example: https://github.com/thewca/tnoodle/releases/download/v1.2.3/TNoodle-WCA-1.2.3.jar
                  allowed:
                    type: array
                    items:
                      type: string
                    example:
                    - TNoodle-WCA-1.2.3
                  publicKeyBytes:
                    type:
                    - string
                    - 'null'
                  history:
                    type: array
                    items:
                      type: string
      security: []
  "/v0/search":
    get:
      summary: Omni search across competitions, users, regulations, incidents
      tags:
      - search
      operationId: omniSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      oneOf:
                      - "$ref": "#/components/schemas/SearchResultCompetition"
                      - "$ref": "#/components/schemas/SearchResultUser"
                      - "$ref": "#/components/schemas/SearchResultRegulation"
                      - "$ref": "#/components/schemas/SearchResultIncident"
        '400':
          description: No query specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No query specified
      security: []
  "/v0/search/posts":
    get:
      summary: Search posts
      tags:
      - search
      operationId: postsSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultPost"
      security: []
  "/v0/search/competitions":
    get:
      summary: Search competitions
      tags:
      - search
      operationId: competitionsSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultCompetition"
      security: []
  "/v0/search/users":
    get:
      summary: Search users
      tags:
      - search
      operationId: usersSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultUser"
      security: []
  "/v0/search/persons":
    get:
      summary: Search persons
      tags:
      - search
      operationId: personsSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      - name: persons_table
        in: query
        required: false
        schema:
          type: boolean
        description: Include persons table data
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultPerson"
      security: []
  "/v0/search/regulations":
    get:
      summary: Search regulations
      tags:
      - search
      operationId: regulationsSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultRegulation"
      security: []
  "/v0/search/incidents":
    get:
      summary: Search incidents
      tags:
      - search
      operationId: incidentsSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResultIncident"
      security: []
  "/v0/users":
    get:
      summary: Get users by IDs
      tags:
      - users
      operationId: getUsersByIds
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: false
        description: Comma-separated list of user IDs
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        wca_id:
                          type: string
                        name:
                          type: string
                        gender:
                          type: string
                        country_iso2:
                          type: string
                        country:
                          type: object
      security: []
    post:
      summary: Get users by IDs (POST method)
      tags:
      - users
      operationId: getUsersByIdsPost
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        wca_id:
                          type: string
                        name:
                          type: string
                        gender:
                          type: string
                        country_iso2:
                          type: string
                        country:
                          type: object
      security: []
  "/v0/users/me":
    get:
      summary: Get current user info
      tags:
      - users
      operationId: getCurrentUser
      security:
      - bearerAuth: []
      parameters:
      - name: upcoming_competitions
        in: query
        required: false
        schema:
          type: boolean
      - name: ongoing_competitions
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/Person"
                  upcoming_competitions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CompetitionInfo"
                  ongoing_competitions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CompetitionInfo"
                  rankings:
                    type: object
                    properties:
                      single:
                        type: array
                        items:
                          type: object
                      average:
                        type: array
                        items:
                          type: object
        '401':
          description: Unauthorized
  "/v0/users/{id}":
    get:
      summary: Get user by ID or WCA ID
      description: |
        Retrieve a user by either:
        - Numeric ID (e.g., 12345)
        - WCA ID (e.g., 2016DOE01)

        The server automatically detects which type of identifier is provided.
      tags:
      - users
      operationId: getUserByIdentifier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/Person"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type:
                    - object
                    - 'null'
      security: []
  "/v0/delegates":
    get:
      summary: Get list of all delegates
      tags:
      - users
      operationId: getDelegates
      responses:
        '200':
          description: List of delegates
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Person"
      security: []
  "/v0/delegates/search-index":
    get:
      summary: Get delegates search index
      tags:
      - users
      operationId: getDelegatesSearchIndex
      responses:
        '200':
          description: Delegate search index
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    wca_id:
                      type: string
                    thumb_url:
                      type: string
                      format: uri
      security: []
  "/v0/persons":
    get:
      summary: List persons
      tags:
      - persons
      operationId: listPersons
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Search query
      - name: wca_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list of WCA IDs to filter by
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Paginated list of persons
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/PersonInfo"
      security: []
  "/v0/persons/{wca_id}":
    get:
      summary: Get information for a person
      tags:
      - users
      operationId: personByWCAId
      parameters:
      - name: wca_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PersonInfo"
      security: []
  "/v0/persons/{wca_id}/results":
    get:
      summary: Get results for a person
      tags:
      - users
      operationId: personResults
      parameters:
      - name: wca_id
        in: path
        required: true
        schema:
          type: string
      - name: event_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Results"
      security: []
  "/v0/persons/{wca_id}/records":
    get:
      summary: Get records for a person
      tags:
      - users
      operationId: personRecords
      parameters:
      - name: wca_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Results"
      security: []
  "/v0/persons/{wca_id}/competitions":
    get:
      summary: Get competitions for a person
      tags:
      - users
      operationId: personCompetitions
      parameters:
      - name: wca_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Competitions"
      security: []
  "/v0/persons/{wca_id}/personal_records":
    get:
      summary: Get person personal records by WCA ID
      tags:
      - persons
      operationId: getPersonPersonalRecords
      parameters:
      - name: wca_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Personal records
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/WcifPersonalBest"
      security: []
  "/v0/geocoding/search":
    get:
      summary: Geocode a location query
      tags:
      - geocoding
      operationId: geocodeLocation
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Location query string
      responses:
        '200':
          description: Google Maps geocoding response
          content:
            application/json:
              schema:
                type: object
                description: Google Maps Geocoding API response
      security: []
  "/v0/geocoding/time_zone":
    get:
      summary: Get timezone from coordinates
      tags:
      - geocoding
      operationId: getTimezoneFromCoords
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: integer
        description: Latitude in microdegrees
      - name: lng
        in: query
        required: true
        schema:
          type: integer
        description: Longitude in microdegrees
      responses:
        '200':
          description: Timezone names for the coordinates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: America/Los_Angeles
      security: []
  "/v0/countries":
    get:
      summary: Get list of all countries
      tags:
      - wca
      operationId: getCountries
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Country"
      security: []
  "/v0/records":
    get:
      summary: Get all records (world, continental, national)
      tags:
      - results
      operationId: getRecords
      responses:
        '200':
          description: Records by type
          content:
            application/json:
              schema:
                type: object
                properties:
                  world_records:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        single:
                          type: integer
                        average:
                          type: integer
                  continental_records:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          single:
                            type: integer
                          average:
                            type: integer
                  national_records:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          single:
                            type: integer
                          average:
                            type: integer
      security: []
  "/v0/known-timezones":
    get:
      summary: Get a list of Olson timezones that the backend understands
      tags:
      - wca
      operationId: knownTimezones
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: America/New_York
      security: []
  "/v0/regional-organizations":
    get:
      summary: A list of currently acknowledged regional organizations
      tags:
      - wca
      operationId: regionalOrganizations
      responses:
        '200':
          description: Retrieved organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/RegionalOrganization"
      security: []
  "/v0/competition_series/{id}":
    get:
      summary: Get competition series
      tags:
      - competitions
      operationId: getCompetitionSeries
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Competition series WCIF
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  competitions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WcifSchedule"
        '404':
          description: Competition series not found
      security: []
  "/v0/results/rankings/{event_id}/{type}":
    get:
      summary: Get the current rankings
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: show
        schema:
          type: string
      - in: query
        name: gender
        schema:
          type: string
      operationId: getRankings
      responses:
        '200':
          description: Successfully retrieved rankings
          content:
            application/json:
              schema:
                type: object
                required:
                - rankings
                - timestamp
                properties:
                  rankings:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ExtendedResult"
                  timestamp:
                    type: string
                    format: date
      security: []
  "/v0/results/records":
    get:
      summary: Get the current records for all regions
      parameters:
      - in: query
        name: event_id
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: show
        schema:
          type: string
      - in: query
        name: gender
        schema:
          type: string
      operationId: getRecords2
      responses:
        '200':
          description: Successfully retrieved records
          content:
            application/json:
              schema:
                type: object
                required:
                - records
                - timestamp
                properties:
                  records:
                    "$ref": "#/components/schemas/RecordByEvent"
                  timestamp:
                    type: string
                    format: date
      security: []
  "/v0/results/records/{id}":
    get:
      summary: Get record by ID
      tags:
      - results
      operationId: getRecordById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record details
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Record"
      security: []
  "/v0/results/records/{id}/history":
    get:
      summary: Get record history
      tags:
      - results
      operationId: getRecordHistory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Record history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    result:
                      type: object
                    value:
                      type: integer
                    personName:
                      type: string
                    competitionId:
                      type: string
                    date:
                      type: string
                      format: date
      security: []
  "/v0/results/{user_id}/qualification_data":
    get:
      summary: Get user qualification data
      tags:
      - results
      operationId: getUserQualificationData
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ISO 8601 date string
      responses:
        '200':
          description: User qualification data
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid date format
        '404':
          description: User not found
      security: []
  "/v0/export/public":
    get:
      summary: Get Export Information
      tags:
      - results
      operationId: publicExports
      responses:
        '200':
          description: Successfully retrieved exports
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExportInfo"
      security: []
  "/v0/competition_index":
    get:
      summary: Get a list of (upcoming) competitions for table display
      tags:
      - competitions
      operationId: competitionList
      parameters:
      - name: include_cancelled
        in: query
        schema:
          type: boolean
      - name: continent
        in: query
        schema:
          type: string
      - name: country_iso2
        in: query
        schema:
          type: string
      - name: delegate
        in: query
        schema:
          type: string
      - name: event_ids[]
        in: query
        schema:
          type: array
          items:
            type: string
      - name: start
        in: query
        schema:
          type: string
          format: datetime
      - name: end
        in: query
        schema:
          type: string
          format: datetime
      - name: admin_status
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: ongoing_and_future
        in: query
        schema:
          type: string
          format: datetime
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CompetitionIndex"
      security: []
  "/v0/competitions":
    get:
