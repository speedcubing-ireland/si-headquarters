      - system
      operationId: authResults
      responses:
        '200':
          description: User can admin results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          description: Please log in
        '403':
          description: Cannot administer results
      security:
      - bearerAuth: []
  "/v0/users/me/personal_records":
    get:
      summary: Get current user's personal records
      tags:
      - users
      operationId: getUserPersonalRecords
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Personal records for current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  single:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WcifPersonalBest"
                  average:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WcifPersonalBest"
        '401':
          description: Unauthorized
  "/v0/users/me/preferred_events":
    get:
      summary: Get current user's preferred events
      tags:
      - users
      operationId: getUserPreferredEvents
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of preferred event IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: '333'
        '401':
          description: Unauthorized
  "/v0/users/me/bookmarks":
    get:
      summary: Get current user's bookmarked competitions
      tags:
      - users
      operationId: getUserBookmarks
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of bookmarked competition IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: WC2025
        '401':
          description: Unauthorized
  "/v0/users/me/permissions":
    get:
      summary: Get user's permissions
      tags:
      - users
      operationId: userPermissions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved permissions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserPermissions"
  "/v0/user_groups":
    get:
      summary: Get user groups
      tags:
      - users
      operationId: userGroups
      parameters:
      - name: isActive
        in: query
        schema:
          type: boolean
        description: Filter by whether the group is active
      - name: isHidden
        in: query
        schema:
          type: boolean
        description: Filter by whether the group is hidden
      - name: groupType
        in: query
        schema:
          type: string
        description: Filter by group type (e.g., "officers")
      - name: sort
        in: query
        schema:
          type: string
        description: Sort by a specific field (e.g., "start_date", "-created_at")
      responses:
        '200':
          description: A list of user groups
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/UserGroup"
      security:
      - bearerAuth: []
  "/v0/user_roles":
    get:
      summary: Get user roles
      tags:
      - users
      operationId: userRoles
      parameters:
      - name: isActive
        in: query
        schema:
          type: boolean
        description: Filter by whether the group is active
      - name: isGroupHidden
        in: query
        schema:
          type: boolean
        description: Filter by whether the group is hidden
      - name: userId
        in: query
        schema:
          type: integer
        description: Filter by user ID
      - name: groupId
        in: query
        schema:
          type: integer
        description: Filter by group ID
      - name: status
        in: query
        schema:
          type: string
        description: Filter by metadata status (e.g., "chair")
      - name: groupType
        in: query
        schema:
          type: string
        description: Filter by group type (e.g., "officers")
      - name: parentGroupId
        in: query
        schema:
          type: number
        description: Filter by parent Group
      - name: isLead
        in: query
        schema:
          type: boolean
        description: Filter by whether the user is the lead of the group
      - name: sort
        in: query
        schema:
          type: string
        description: Sort by a specific field (e.g., "start_date", "-created_at")
      - name: perPage
        in: query
        schema:
          type: integer
          default: 100
        description: Number of results per page
      responses:
        '200':
          description: A list of user roles
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/UserRole"
      security:
      - bearerAuth: []
    post:
      summary: Create user role
      tags:
      - user_roles
      operationId: createUserRole
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: integer
                groupId:
                  type: integer
                groupType:
                  type: string
                status:
                  type: string
                location:
                  type: string
                endDate:
                  type: string
                  format: date
                banReason:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
        '422':
          description: Invalid group type or other validation error
  "/v0/user_roles/{id}":
    patch:
      summary: Update user role
      tags:
      - user_roles
      operationId: updateUserRole
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                groupId:
                  type: integer
                location:
                  type: string
                endDate:
                  type: string
                  format: date
                banReason:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
        '422':
          description: Invalid parameters
    delete:
      summary: Delete user role
      tags:
      - user_roles
      operationId: deleteUserRole
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
  "/v0/user_roles/search":
    get:
      summary: Search user roles
      tags:
      - user_roles
      operationId: searchUserRoles
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: groupType
        in: query
        required: true
        schema:
          type: string
          enum:
          - delegate_regions
          - delegate_probation
          - translators
          - officers
          - teams_committees
          - councils
          - board
          - banned_competitors
      responses:
        '200':
          description: Matching roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      "$ref": "#/components/schemas/UserRole"
      security:
      - bearerAuth: []
  "/v0/competitions/{competitionId}/wcif":
    get:
      summary: Get competition WCIF (requires manage permission)
      tags:
      - competitions
      operationId: getCompetitionWcif
      security:
      - bearerAuth: []
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Competition WCIF
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WcifSchedule"
        '403':
          description: Not authorized to manage competition
        '404':
          description: Competition not found
  "/v0/competitions/{competitionId}/wcif/update":
    patch:
      summary: Update competition WCIF
      tags:
      - competitions
      operationId: updateCompetitionWcif
      security:
      - bearerAuth: []
      parameters:
      - name: competitionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WcifSchedule"
      responses:
        '200':
