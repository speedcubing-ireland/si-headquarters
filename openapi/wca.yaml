      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Competitor quit from round
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  quit:
                    type: integer
        '400':
          description: Cannot quit competitor with results
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  "/v0/me":
    get:
      summary: Get current authenticated user
      tags:
      - users
      operationId: getMe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response with current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  me:
                    "$ref": "#/components/schemas/Person"
  "/v0/auth/results":
    get:
      summary: Check if user can admin results
